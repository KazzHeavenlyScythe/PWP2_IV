<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>KRS Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark main-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <span class="brand-icon">K</span>
            KRS Mahasiswa
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavbar">
            {% if session.get('mahasiswa_id') %}
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('matakuliah') }}">Mata Kuliah</a>
                <a class="nav-link" href="{{ url_for('matakuliah_saya') }}">Mata Kuliah Saya</a>

                <a href="{{ url_for('logout') }}" class="btn btn-gold btn-sm">
                    Logout
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert alert-info alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close"
                    data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast border-0 shadow" role="alert">
        <div class="toast-header">
            <strong class="me-auto">KRS Mahasiswa</strong>
            <button type="button" class="btn-close"
                    data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastMessage">
            Notifikasi aplikasi
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
